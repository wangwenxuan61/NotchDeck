name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check translations
        run: python3 scripts/check-translations.py
      - name: Run logic checks
        run: swift run NotchDeckChecks
      - name: Build
        run: swift build -c release --product NotchDeck
